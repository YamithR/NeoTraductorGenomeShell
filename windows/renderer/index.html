<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeoTraductor</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="window-bar" id="windowBar">
    <span class="window-title">NeoTraductor</span>
    <div class="window-controls">
      <span id="settingsBtn" class="ctrl-btn" title="Configuración">⚙</span>
      <span id="infoBtn" class="ctrl-btn" title="Acerca de">ⓘ</span>
      <span id="closeBtn" class="ctrl-btn close" title="Cerrar">&times;</span>
    </div>
  </div>

  <div class="translator-container">
    <div class="lang-row">
      <select id="sourceLang"></select>
      <button id="swapBtn" class="swap-btn" title="Intercambiar idiomas">⇄</button>
      <select id="targetLang"></select>
    </div>

    <textarea id="textInput" placeholder="Escribe texto para traducir..." rows="3"></textarea>

    <button id="translateBtn">Traducir</button>

    <div id="resultArea" class="result-box hidden">
      <div id="resultText" class="result-label"></div>
      <div class="action-row">
        <button id="copyBtn" class="action-btn">📋 Copiar</button>
        <button id="swapLangBtn" class="action-btn">🔄 Intercambiar</button>
        <button id="clearBtn" class="action-btn">🗑️ Limpiar</button>
      </div>
    </div>

    <div id="loadingIndicator" class="loading hidden">Traduciendo...</div>
    <div id="errorMsg" class="error hidden"></div>

    <div class="history-section">
      <div class="history-title">Historial</div>
      <div id="historyList" class="history-list"></div>
    </div>
  </div>

  <div id="settingsModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <span>Configuración</span>
        <span class="modal-close" id="settingsClose">&times;</span>
      </div>
      <div class="modal-body">
        <div class="setting-row">
          <label>Atajo de teclado</label>
          <input type="text" id="shortcutInput" class="shortcut-input" readonly
                 placeholder="Presiona una tecla..."
                 value="Ctrl+Shift+T">
          <button id="shortcutBtn" class="modal-btn">Cambiar</button>
        </div>
        <div class="setting-row">
          <label>Siempre al frente</label>
          <input type="checkbox" id="ontopToggle">
        </div>
        <div class="setting-row">
          <label>Copiar al portapapeles</label>
          <input type="checkbox" id="autoClipToggle">
        </div>
      </div>
    </div>
  </div>

  <div id="aboutModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <span>Acerca de NeoTraductor</span>
        <span class="modal-close" id="aboutClose">&times;</span>
      </div>
      <div class="modal-body about-body">
        <div id="aboutContent"></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
